name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formula-presence:
    name: Check whether a formula exists
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        run: |
          if compgen -G "Formula/*.rb" > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "No formula in Formula/ yet; the first bump-formula run creates it." >&2
          fi

  test-bot:
    name: brew test-bot (${{ matrix.os }})
    needs: check-formula-presence
    if: needs.check-formula-presence.outputs.present == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: Homebrew/actions/setup-homebrew@main
      - run: brew test-bot --only-cleanup-before
      - run: brew test-bot --only-setup
      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
